apiVersion: meta.pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-ziti
  annotations:
    meta.crossplane.io/maintainer: nenkoru (https://github.com/nenkoru)
    meta.crossplane.io/source: github.com/nenkoru/crossplane-provider-ziti
    meta.crossplane.io/license: Apache-2.0
    friendly-name.meta.crossplane.io: Provider Ziti
    meta.crossplane.io/description: |
      A Crossplane provider that manages OpenZiti resources: services,
      configs, service and edge router policies, identities, edge routers,
      posture checks and auth policies.
    meta.crossplane.io/readme: |
      `provider-ziti` is a Crossplane provider that manages the resources of an
      [OpenZiti](https://openziti.io/) network through the Edge Management API
      of its controller. Services, configs, service and edge router policies,
      identities, edge routers, posture checks and auth policies become
      Kubernetes resources that are created, kept in sync and deleted by the
      provider.

      It targets Crossplane v2: managed resources and `ProviderConfig` are
      namespaced, and a cluster-scoped `ClusterProviderConfig` is available.
      The API group is `ziti.crossplane.io/v1alpha1` and is still alpha.

      The resources, their settings and how they map to Ziti entities are
      documented in the
      [repository](https://github.com/nenkoru/crossplane-provider-ziti),
      including a quick start, examples per kind and troubleshooting notes.
spec:
  capabilities:
    - safe-start
