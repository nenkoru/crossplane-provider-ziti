apiVersion: meta.pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-ziti
  annotations:
    meta.crossplane.io/maintainer: nenkoru (https://github.com/nenkoru)
    meta.crossplane.io/source: github.com/nenkoru/crossplane-provider-ziti
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      A Crossplane provider that manages OpenZiti resources: services,
      configs, service and edge router policies, identities, edge routers,
      posture checks and auth policies.
    meta.crossplane.io/readme: |
      provider-ziti manages the resources of an OpenZiti network through the
      Edge Management API of its controller.
spec:
  capabilities:
    - safe-start
