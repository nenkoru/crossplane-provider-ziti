---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: externaljwtsigners.ziti.crossplane.io
spec:
  group: ziti.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - ziti
    kind: ExternalJWTSigner
    listKind: ExternalJWTSignerList
    plural: externaljwtsigners
    singular: externaljwtsigner
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.forProvider.name
      name: NAME
      type: string
    - jsonPath: .status.atProvider.id
      name: ID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: READY
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ExternalJWTSigner is an issuer of JSON Web Tokens, such as an OpenID
          Connect provider, whose tokens Ziti accepts for authentication. Auth
          policies refer to it by its name or ID.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ExternalJWTSignerSpec defines the desired state of an ExternalJWTSigner.
            properties:
              forProvider:
                description: |-
                  ExternalJWTSignerParameters define the desired state of a Ziti external
                  JWT signer. The keys that verify its tokens come from jwksEndpoint or from
                  certPem.
                properties:
                  audience:
                    description: Audience is the aud claim a token must have to be
                      accepted.
                    minLength: 1
                    type: string
                  certPem:
                    description: |-
                      CertPem is the PEM encoded certificate that verifies the tokens of the
                      signer, for a signer without a JSON Web Key Set.
                    minLength: 1
                    type: string
                  claimsProperty:
                    description: |-
                      ClaimsProperty is the claim of a token that tells which identity it is
                      for. Ziti takes the subject if it is not set.
                    minLength: 1
                    type: string
                  clientId:
                    description: ClientID is the OAuth client ID clients obtain a
                      token with.
                    minLength: 1
                    type: string
                  enabled:
                    description: Enabled makes Ziti accept the tokens of this signer.
                    type: boolean
                  enrollAttributeClaimsSelector:
                    description: |-
                      EnrollAttributeClaimsSelector is the claim of a token that holds the
                      role attributes of the identity an enrollment creates.
                    type: string
                  enrollAuthPolicyId:
                    description: |-
                      EnrollAuthPolicyID is the name or ID of the auth policy of the
                      identities an enrollment creates. Ziti takes the default auth policy
                      if it is not set.
                    minLength: 1
                    type: string
                  enrollNameClaimsSelector:
                    description: |-
                      EnrollNameClaimsSelector is the claim of a token that names the
                      identity an enrollment creates. Ziti takes the subject if it is not
                      set.
                    minLength: 1
                    type: string
                  enrollToCertEnabled:
                    description: |-
                      EnrollToCertEnabled lets the holder of a token of this signer enroll,
                      which creates an identity that authenticates with a certificate.
                    type: boolean
                  enrollToTokenEnabled:
                    description: |-
                      EnrollToTokenEnabled lets the holder of a token of this signer enroll,
                      which creates an identity that authenticates with tokens of this
                      signer.
                    type: boolean
                  externalAuthUrl:
                    description: ExternalAuthURL is the URL clients obtain a token
                      of this signer from.
                    minLength: 1
                    type: string
                  issuer:
                    description: |-
                      Issuer is the iss claim of the tokens of this signer. No two signers
                      may have the same issuer.
                    minLength: 1
                    type: string
                  jwksEndpoint:
                    description: |-
                      JwksEndpoint is the URL of the JSON Web Key Set of the signer. It must
                      name a host, and its scheme must be http or https, in any case.
                    pattern: ^[Hh][Tt][Tt][Pp][Ss]?://([^/?#@]*@)?(\[[0-9A-Fa-f:.]+\]|[^/?#@:\[\]]+)(:[0-9]*)?([/?#].*)?$
                    type: string
                  kid:
                    description: |-
                      Kid is the key ID of the certificate in certPem: the kid header of the
                      tokens it verifies.
                    minLength: 1
                    type: string
                  name:
                    description: Name of the external JWT signer.
                    type: string
                  scopes:
                    description: Scopes are the OAuth scopes clients request a token
                      with.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  tags:
                    additionalProperties:
                      type: string
                    description: Tags is a map of tags.
                    type: object
                  targetToken:
                    default: ACCESS
                    description: |-
                      TargetToken is the token clients present to Ziti: the access token or
                      the ID token.
                    enum:
                    - ACCESS
                    - ID
                    type: string
                  useExternalId:
                    description: |-
                      UseExternalID looks the identity up by its externalId instead of its
                      ID.
                    type: boolean
                required:
                - audience
                - issuer
                - name
                type: object
                x-kubernetes-validations:
                - message: exactly one of jwksEndpoint and certPem is required
                  rule: has(self.jwksEndpoint) != has(self.certPem)
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: |-
              ExternalJWTSignerStatus defines the observed state of an
              ExternalJWTSigner.
            properties:
              atProvider:
                description: ExternalJWTSignerObservation keeps the observed state.
                properties:
                  audience:
                    type: string
                  claimsProperty:
                    type: string
                  clientId:
                    type: string
                  commonName:
                    description: |-
                      CommonName, Fingerprint, NotBefore and NotAfter describe the
                      certificate of a signer that has one.
                    type: string
                  createdAt:
                    type: string
                  enabled:
                    type: boolean
                  enrollAttributeClaimsSelector:
                    type: string
                  enrollAuthPolicyId:
                    type: string
                  enrollNameClaimsSelector:
                    type: string
                  enrollToCertEnabled:
                    type: boolean
                  enrollToTokenEnabled:
                    type: boolean
                  externalAuthUrl:
                    type: string
                  fingerprint:
                    type: string
                  id:
                    type: string
                  issuer:
                    type: string
                  jwksEndpoint:
                    type: string
                  kid:
                    type: string
                  name:
                    type: string
                  notAfter:
                    type: string
                  notBefore:
                    type: string
                  scopes:
                    items:
                      type: string
                    type: array
                  tags:
                    additionalProperties:
                      type: string
                    type: object
                  targetToken:
                    type: string
                  updatedAt:
                    type: string
                  useExternalId:
                    type: boolean
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
