                            type: string
                          type: array
                        osType:
                          type: string
                        path:
                          type: string
                        signerFingerprints:
                          items:
                            type: string
                          type: array
                      type: object
                    type: array
                  roleAttributes:
                    items:
                      type: string
                    type: array
                  semantic:
                    type: string
                  tags:
                    additionalProperties:
                      type: string
                    type: object
                  typeId:
                    type: string
                  updatedAt:
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
