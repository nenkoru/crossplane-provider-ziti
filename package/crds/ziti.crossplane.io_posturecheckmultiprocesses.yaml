          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PostureCheckMultiProcessSpec defines the desired state of a
              PostureCheckMultiProcess.
            properties:
              forProvider:
                description: |-
                  PostureCheckMultiProcessParameters define the desired state of a Multi
                  Process Posture Check.
                properties:
                  name:
                    description: Name of the posture check.
                    type: string
                  processes:
                    description: |-
                      Processes to look for. Ziti identifies a process by its operating
                      system and path, so each pair may be listed once, and their order does
                      not matter.
                    items:
                      description: MultiProcess defines one of the processes of a
                        multi process posture check.
                      properties:
                        hashes:
                          description: |-
                            Hashes are the SHA-512 hashes the executable may have. Any executable
                            passes if there are none. Ziti keeps them as a set, so their order and
                            duplicates do not matter.
                          items:
                            description: |-
                              HexString is a hexadecimal value of a posture check: a MAC address, the
                              hash of a file or the fingerprint of a certificate. Its digits may be in
                              either case and separated by colons, dashes, dots or spaces. Ziti stores
                              the value in lower case and without separators, so "00:1A:2B:3C:4D:5E" and
                              "001a2b3c4d5e" are the same value.
                            pattern: ^[0-9A-Fa-f]+([ :.-][0-9A-Fa-f]+)*$
                            type: string
                          type: array
                        osType:
                          description: OsType is the operating system the process
                            runs on.
                          enum:
                          - Windows
                          - WindowsServer
                          - Android
                          - iOS
                          - Linux
                          - macOS
                          type: string
                        path:
                          description: Path of the executable.
                          type: string
                        signerFingerprints:
                          description: |-
                            SignerFingerprints are the SHA-1 fingerprints of the certificates the
                            executable may be signed with. Any signer passes if there are none.
                            Ziti keeps them as a set, so their order and duplicates do not matter.
                          items:
                            description: |-
