                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: |-
              PostureCheckMultiProcessStatus defines the observed state of a
              PostureCheckMultiProcess.
            properties:
              atProvider:
                description: PostureCheckMultiProcessObservation keeps the observed
                  state.
                properties:
                  createdAt:
                    type: string
                  id:
                    type: string
                  name:
                    type: string
                  processes:
                    items:
                      description: |-
                        MultiProcessObservation is a process as Ziti reports it, with its hashes
