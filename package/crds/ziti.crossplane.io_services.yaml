---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: services.ziti.crossplane.io
spec:
  group: ziti.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - ziti
    kind: Service
    listKind: ServiceList
    plural: services
    singular: service
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.forProvider.name
      name: NAME
      type: string
    - jsonPath: .status.atProvider.id
      name: ID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: READY
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Service is a Ziti service: something identities connect to through the
          network. Service policies say who may dial and who may host it, its configs
          say what tunnelers intercept and where they send the traffic.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ServiceSpec specifies the desired state of a Ziti Service.
            properties:
              forProvider:
                description: ServiceParameters define the desired state of a Ziti
                  Service.
                properties:
                  configs:
                    description: |-
                      Configs are the names or IDs of the configs of the service, one per
                      config type: what the tunnelers of clients intercept (intercept.v1) and
                      where the tunnelers of hosts send the traffic (host.v1 or host.v2).
                      Names are resolved to IDs.
                    items:
                      type: string
                    type: array
                  encryptionRequired:
                    default: true
                    description: |-
                      EncryptionRequired makes the clients and the hosts of the service
                      encrypt its traffic end to end, on top of the encryption between
                      routers.
                    type: boolean
                  maxIdleTimeMillis:
                    description: |-
                      MaxIdleTimeMillis closes a circuit of the service that carried no
                      traffic for so many milliseconds. Zero keeps idle circuits open.
                    format: int64
                    type: integer
                  name:
                    description: Name of the service.
                    type: string
                  roleAttributes:
                    description: |-
                      RoleAttributes are the attributes policies select the service by, as
                      "#attribute".
                    items:
                      type: string
                    type: array
                  tags:
                    additionalProperties:
                      type: string
                    description: |-
                      Tags are free-form labels Ziti stores with the service. They do not
                      affect access or routing.
                    type: object
                  terminatorStrategy:
                    description: |-
                      TerminatorStrategy says which of the terminators that host the service
                      gets a new connection: smartrouting takes the one with the cheapest
                      route, weighted and random spread the connections, sticky chooses like
                      smartrouting and keeps a client on the terminator it got first while
                      that terminator is available.
                    enum:
                    - smartrouting
                    - weighted
                    - random
                    - sticky
                    type: string
                required:
                - name
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: ServiceStatus represents the observed state of a Ziti Service.
            properties:
              atProvider:
                description: ServiceObservation represents the observed state of a
                  Ziti Service.
                properties:
                  configs:
                    description: Configs is the list of config IDs.
                    items:
                      type: string
                    type: array
                  createdAt:
                    description: CreatedAt is the creation timestamp.
                    type: string
                  encryptionRequired:
                    description: EncryptionRequired indicates whether encryption is
                      required.
                    type: boolean
                  id:
                    description: ID is the unique identifier of the service.
                    type: string
                  maxIdleTimeMillis:
                    description: |-
                      MaxIdleTimeMillis closes a circuit of the service that carried no
                      traffic for so many milliseconds. Zero keeps idle circuits open.
                    format: int64
                    type: integer
                  name:
                    description: Name is the current name of the service.
                    type: string
                  roleAttributes:
                    description: RoleAttributes is the list of role attributes.
                    items:
                      type: string
                    type: array
                  tags:
                    additionalProperties:
                      type: string
                    description: Tags is the map of tags.
                    type: object
                  terminatorStrategy:
                    description: TerminatorStrategy is the current terminator strategy.
                    type: string
                  updatedAt:
                    description: UpdatedAt is the last update timestamp.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
