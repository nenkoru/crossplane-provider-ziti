---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: posturecheckprocesses.ziti.crossplane.io
spec:
  group: ziti.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - ziti
    kind: PostureCheckProcess
    listKind: PostureCheckProcessList
    plural: posturecheckprocesses
    singular: posturecheckprocess
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.forProvider.name
      name: NAME
      type: string
    - jsonPath: .status.atProvider.id
      name: ID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: READY
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PostureCheckProcess is the top level Ziti Process Posture Check
          resource.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PostureCheckProcessSpec defines the desired state of a PostureCheckProcess.
            properties:
              forProvider:
                description: |-
                  PostureCheckProcessParameters define the desired state of a Process Posture
                  Check.
                properties:
                  name:
                    description: Name of the posture check.
                    type: string
                  process:
                    description: Process that must be running.
                    properties:
                      hashes:
                        description: |-
                          Hashes are the SHA-512 hashes the executable may have. Any executable
                          passes if there are none. Ziti keeps them as a set, so their order and
                          duplicates do not matter.
                        items:
                          description: |-
                            HexString is a hexadecimal value of a posture check: a MAC address, the
                            hash of a file or the fingerprint of a certificate. Its digits may be in
                            either case and separated by colons, dashes, dots or spaces. Ziti stores
                            the value in lower case and without separators, so "00:1A:2B:3C:4D:5E" and
                            "001a2b3c4d5e" are the same value.
                          pattern: ^[0-9A-Fa-f]+([ :.-][0-9A-Fa-f]+)*$
                          type: string
                        type: array
                      osType:
                        description: OsType is the operating system the process runs
                          on.
                        enum:
                        - Windows
                        - WindowsServer
                        - Android
                        - iOS
                        - Linux
                        - macOS
                        type: string
                      path:
                        description: Path of the executable.
                        type: string
                      signerFingerprint:
                        description: |-
                          SignerFingerprint is the SHA-1 fingerprint of the certificate the
                          executable must be signed with.
                        pattern: ^([0-9A-Fa-f]+([ :.-][0-9A-Fa-f]+)*)?$
                        type: string
                    required:
                    - osType
                    - path
                    type: object
                  roleAttributes:
                    description: RoleAttributes for the posture check.
                    items:
                      type: string
                    type: array
                  tags:
                    additionalProperties:
                      type: string
                    description: Tags is a map of tags.
                    type: object
                required:
                - name
                - process
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: PostureCheckProcessStatus defines the observed state of a
              PostureCheckProcess.
            properties:
              atProvider:
                description: PostureCheckProcessObservation keeps the observed state.
                properties:
                  createdAt:
                    type: string
                  id:
                    type: string
                  name:
                    type: string
                  process:
                    description: |-
                      ProcessObservation is a process as Ziti reports it, with its hashes and
                      fingerprint in lower case and without separators.
                    properties:
                      hashes:
                        items:
                          type: string
                        type: array
                      osType:
                        type: string
                      path:
                        type: string
                      signerFingerprint:
                        type: string
                    type: object
                  roleAttributes:
                    items:
                      type: string
                    type: array
                  tags:
                    additionalProperties:
                      type: string
                    type: object
                  typeId:
                    type: string
                  updatedAt:
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
