              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ProviderConfigSpec specifies the state of a ProviderConfig.
            properties:
              ca:
                description: |-
                  CA is the PEM-encoded CA bundle used to verify the controller
                  certificate. The system roots are used when it is not set.
                type: string
              cert:
                description: Cert is the PEM-encoded client certificate for certificate
                  authentication.
                type: string
              credentials:
                description: |-
