# Credentials of a Ziti administrator. The Secret may hold the keys host,
# username, password, cert, key and ca.
apiVersion: v1
kind: Secret
metadata:
  name: ziti-credentials
  namespace: default
type: Opaque
stringData:
  username: admin
  password: change-me
---
apiVersion: ziti.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: default
  namespace: default
spec:
  # URL of the Ziti controller. /edge/management/v1 is appended if missing.
  host: https://controller.example.com:1280
  credentials:
    source: Secret
    secretRef:
      name: ziti-credentials
  # The controller certificate is verified against the system roots by
  # default. Set ca for a controller with a private PKI:
  # ca: |
  #   -----BEGIN CERTIFICATE-----
  #   ...
  #   -----END CERTIFICATE-----
  # Or, for testing only, skip verification:
  # insecureSkipTLSVerify: true
